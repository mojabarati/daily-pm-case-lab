name: Daily PM Case Lab

on:
  workflow_dispatch:
    inputs:
      company:
        description: Optional catalog company ID, name, or alias
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-pm-case-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      PM_CASE_GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MAX_CASE_CANDIDATES: "5"
      MAX_RESEARCH_PASSES: "3"
      MAX_SOURCES: "12"
      MAX_AGENT_RUNS: "12"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --all-groups --frozen --python 3.12

      - name: Verify before generation
        run: |
          uv run ruff check .
          uv run pytest

      - name: Generate case
        shell: bash
        run: |
          args=(generate)
          if [[ -n "${{ inputs.company }}" ]]; then
            args+=(--company "${{ inputs.company }}")
          fi
          uv run pm-case-lab "${args[@]}"

      - name: Commit generated artifacts
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- cases data/history.jsonl)" ]]; then
            echo "No generated changes to commit"
            exit 1
          fi
          git config user.name "daily-pm-case-lab[bot]"
          git config user.email "daily-pm-case-lab[bot]@users.noreply.github.com"
          git add -- cases data/history.jsonl
          git commit -m "case: publish daily PM exercise"
          git push

      - name: Deliver GitHub Issue
        shell: bash
        run: |
          case_dir="$(git diff-tree --no-commit-id --name-only -r HEAD | awk -F/ '/^cases\// {print $1 "/" $2; exit}')"
          manifest="$case_dir/manifest.json"
          company="$(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["company"])' "$manifest")"
          title="$(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["case_title"])' "$manifest")"
          score="$(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["quality_score"])' "$manifest")"
          gh issue create \
            --title "Daily PM Case: $company — $title" \
            --body "Case ready: [$case_dir/01-challenge.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/$case_dir/01-challenge.md) — quality $score/100."
